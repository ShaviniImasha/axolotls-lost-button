<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Magic key">
<!-- Key glow aura -->
  <ellipse cx="128" cy="128" rx="90" ry="88" fill="#FFF0A8" opacity=".2"/>

  <g stroke="#E0B84F" stroke-width="3.5" stroke-linejoin="round">
    <!-- Key head ring outer -->
    <circle cx="128" cy="98" r="58" fill="#FFF0A8"/>
    <!-- Key head ring inner hole -->
    <circle cx="128" cy="98" r="34" fill="transparent"/>
    <!-- Key head inner cut-out -->
    <circle cx="128" cy="98" r="34" fill="#FFE070" opacity=".35"/>

    <!-- Key shaft body -->
    <rect x="120" y="150" width="16" height="86" rx="8" fill="#FFF0A8"/>
    <!-- Key teeth -->
    <rect x="136" y="184" width="18" height="12" rx="4" fill="#FFF0A8"/>
    <rect x="136" y="204" width="14" height="10" rx="4" fill="#FFF0A8"/>
    <rect x="136" y="220" width="10" height="8" rx="3" fill="#FFF0A8"/>
  </g>

  <!-- Decorative star cut-out in head -->
  <polygon points="128,80.5 132.6,91.6 144.6,92.6 135.5,100.4 138.3,112.2 128,105.9 117.7,112.2 120.5,100.4 111.4,92.6 123.4,91.6" fill="#E0B84F" stroke="#E0B84F" stroke-width="9" stroke-linejoin="round"/><polygon points="128,80.5 132.6,91.6 144.6,92.6 135.5,100.4 138.3,112.2 128,105.9 117.7,112.2 120.5,100.4 111.4,92.6 123.4,91.6" fill="#FFE070" stroke="#FFE070" stroke-width="5" stroke-linejoin="round"/>

  <!-- Shine on key head -->
  <path d="M84 68 Q96 50 122 46" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <circle cx="170" cy="56" r="4" fill="#FFFFFF" opacity=".65"/>

  <!-- Shaft shine -->
  <path d="M122 156 Q122 192 122 228" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity=".5"/>

  <!-- Floating magical sparkles around key -->
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(54 58) scale(1.1)" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(202 66) scale(1.3)" fill="#FFC1D6" stroke="#D9769A" stroke-width="1.9" stroke-linejoin="round"/>
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(46 186) scale(0.9)" fill="#D7C6FF" stroke="#9B85D9" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(208 188) scale(1)" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
