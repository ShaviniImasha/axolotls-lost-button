<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ancient rune tablet">
<!-- Stone shadow -->
  <ellipse cx="132" cy="232" rx="80" ry="14" fill="#9B85D9" opacity=".35"/>

  <!-- Main tablet stone body -->
  <rect x="48" y="48" width="160" height="188" rx="32" fill="#D7C6FF" stroke="#9B85D9" stroke-width="4"/>

  <!-- Worn carved inset border -->
  <rect x="60" y="60" width="136" height="164" rx="22" fill="none" stroke="#BBA5F5" stroke-width="5" opacity=".55"/>

  <!-- Top stone highlight -->
  <path d="M72 68 Q96 52 148 56" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".65"/>

  <!-- Rune glyphs - cute simplified symbols -->
  <!-- Crown glyph -->
  <path d="M92 104 L100 90 L110 98 L120 82 L130 98 L140 90 L148 104 Z" fill="none" stroke="#9B85D9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Fish glyph -->
  <path d="M94 130 C104 122 140 118 160 130 C140 142 104 138 94 130 Z" fill="none" stroke="#9B85D9" stroke-width="4" stroke-linejoin="round"/>
  <path d="M94 130 L82 122 L82 138 Z" fill="#9B85D9"/>
  <!-- Star glyph -->
  <polygon points="128,150.5 133.3,162.8 146.5,164 136.5,172.8 139.5,185.8 128,178.9 116.5,185.8 119.5,172.8 109.5,164 122.7,162.8" fill="#9B85D9" stroke="#9B85D9" stroke-width="9" stroke-linejoin="round"/><polygon points="128,150.5 133.3,162.8 146.5,164 136.5,172.8 139.5,185.8 128,178.9 116.5,185.8 119.5,172.8 109.5,164 122.7,162.8" fill="#BBA5F5" stroke="#BBA5F5" stroke-width="5" stroke-linejoin="round"/>
  <!-- Dot ornaments -->
  <circle cx="80" cy="86" r="4" fill="#BBA5F5" opacity=".7"/>
  <circle cx="176" cy="86" r="4" fill="#BBA5F5" opacity=".7"/>
  <circle cx="80" cy="200" r="4" fill="#BBA5F5" opacity=".7"/>
  <circle cx="176" cy="200" r="4" fill="#BBA5F5" opacity=".7"/>

  <!-- Kawaii face on tablet -->
  <circle cx="104" cy="200" r="7" fill="#4A3347"/>
  <circle cx="106.5" cy="197" r="2.5" fill="#FFFFFF"/>
  <circle cx="152" cy="200" r="7" fill="#4A3347"/>
  <circle cx="154.5" cy="197" r="2.5" fill="#FFFFFF"/>
  <ellipse cx="90" cy="212" rx="9" ry="6" fill="#FF8FA9" opacity=".6"/>
  <ellipse cx="166" cy="212" rx="9" ry="6" fill="#FF8FA9" opacity=".6"/>
  <path d="M120 210 Q128 218 136 210" fill="none" stroke="#4A3347" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating sparkles -->
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(46 48) scale(1)" fill="#D7C6FF" stroke="#9B85D9" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(210 54) scale(1.2)" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2.1" stroke-linejoin="round"/>
</svg>
