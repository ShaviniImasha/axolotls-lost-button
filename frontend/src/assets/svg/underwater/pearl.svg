<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Glowing pearl">
<!-- Soft glow aura -->
  <circle cx="128" cy="128" r="96" fill="#BDE6FF" opacity=".18"/>
  <circle cx="128" cy="128" r="80" fill="#D7C6FF" opacity=".2"/>

  <!-- Pearl body -->
  <circle cx="128" cy="128" r="70" fill="#FFFFFF" stroke="#6DB3DE" stroke-width="3.5"/>

  <!-- Iridescent pastel sheen patches -->
  <ellipse cx="108" cy="108" rx="28" ry="20" fill="#D7C6FF" opacity=".35"/>
  <ellipse cx="152" cy="148" rx="22" ry="16" fill="#BDE6FF" opacity=".3"/>
  <ellipse cx="140" cy="96" rx="18" ry="12" fill="#FFC1D6" opacity=".3"/>

  <!-- Main shine highlight -->
  <path d="M88 84 Q106 62 140 66" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity=".85"/>
  <circle cx="152" cy="74" r="6" fill="#FFFFFF" opacity=".8"/>
  <!-- Secondary shimmer -->
  <path d="M76 130 Q80 148 86 162" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".45"/>

  <!-- Tiny kawaii sparkle face -->
  <circle cx="110" cy="136" r="7" fill="#4A3347"/>
  <circle cx="112.5" cy="133" r="2.5" fill="#FFFFFF"/>
  <circle cx="146" cy="136" r="7" fill="#4A3347"/>
  <circle cx="148.5" cy="133" r="2.5" fill="#FFFFFF"/>
  <ellipse cx="96" cy="150" rx="9" ry="5.5" fill="#FF8FA9" opacity=".55"/>
  <ellipse cx="160" cy="150" rx="9" ry="5.5" fill="#FF8FA9" opacity=".55"/>
  <path d="M120 148 Q128 156 136 148" fill="none" stroke="#4A3347" stroke-width="3" stroke-linecap="round"/>

  <!-- Outer sparkles -->
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(48 56) scale(1.2)" fill="#BDE6FF" stroke="#6DB3DE" stroke-width="2.1" stroke-linejoin="round"/>
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(204 62) scale(1.4)" fill="#D7C6FF" stroke="#9B85D9" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(46 196) scale(0.9)" fill="#FFC1D6" stroke="#D9769A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(206 196) scale(1.1)" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2.3" stroke-linejoin="round"/>
</svg>
