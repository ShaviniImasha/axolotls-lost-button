<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Mint boxfish character">
<g stroke="#5DBBA0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Small fan-shaped tail fin -->
    <path d="M64 128 C38 108 26 102 24 116 C22 130 36 128 36 128 C36 128 22 136 24 150 C26 164 38 158 64 128 Z" fill="#FFF0A8" stroke="#E0B84F" stroke-width="3"/>

    <!-- Tiny fluttery dorsal fin -->
    <path d="M106 82 C114 62 130 60 138 72 C132 76 126 80 120 86 Z" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2.5"/>

    <!-- Chubby boxy-rounded body -->
    <rect x="62" y="80" width="138" height="102" rx="46" fill="#B8F0DC"/>
    <!-- Soft cream-butter belly -->
    <ellipse cx="132" cy="154" rx="55" ry="24" fill="#FFF0A8" opacity=".55" stroke="none"/>

    <!-- Two cute tiny rounded horns on forehead -->
    <ellipse cx="178" cy="80" rx="6" ry="11" transform="rotate(18 178 80)" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2.5"/>
    <ellipse cx="160" cy="76" rx="5.5" ry="9" transform="rotate(12 160 76)" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2.5"/>

    <!-- Adorable pastel polka dots -->
    <circle cx="92" cy="108" r="6" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2"/>
    <circle cx="114" cy="98" r="5" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2"/>
    <circle cx="104" cy="132" r="7" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2"/>
    <circle cx="128" cy="120" r="5.5" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2"/>

    <!-- Cute paddling side fin -->
    <ellipse cx="134" cy="144" rx="14" ry="9" transform="rotate(-10 134 144)" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2"/>
  </g>

  <!-- Sweet forehead highlight -->
  <path d="M124 86 Q146 80 168 86" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity=".7"/>

  <!-- Face: Large anime eye, rosy peach blush, puckered kissy mouth -->
  <circle cx="174" cy="118" r="10.5" fill="#4A3347"/>
  <path d="M167.2 120.1 Q174 125.9 180.8 120.1" fill="none" stroke="#C48DAE" stroke-width="2" stroke-linecap="round"/>
  <circle cx="177.7" cy="114.3" r="4" fill="#FFFFFF"/>
  <circle cx="170.3" cy="121.7" r="2.1" fill="#FFFFFF"/>
  <circle cx="179.3" cy="119.3" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="174" cy="142" rx="11" ry="6.5" fill="#FF8FA9" opacity=".65"/>
  <path d="M170 140 L168 144 M176 140 L174 144" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>
  <!-- Puckered kissy cute '3' mouth -->
  <path d="M196 130 Q199 133 196 136 Q199 139 196 142" fill="none" stroke="#4A3347" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating bubbles -->
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(208 74) scale(0.7)" fill="#B8F0DC" stroke="#5DBBA0" stroke-width="3.6" stroke-linejoin="round"/>
  <circle cx="212" cy="112" r="4" fill="#B8F0DC" stroke="#5DBBA0" stroke-width="1.5" opacity=".7"/>
</svg>
