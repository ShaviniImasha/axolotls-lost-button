<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Peach chubby fish character">
<g stroke="#E39A66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wavy translucent caudal fin with heart lobes -->
    <path d="M68 128 C32 94 18 86 16 104 C14 122 32 128 32 128 C32 128 14 134 16 152 C18 170 32 162 68 128 Z" fill="#FFC1D6" stroke="#D9769A" stroke-width="3"/>
    <path d="M38 116 C26 122 26 134 38 140" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".7"/>

    <!-- Fluttery dorsal & ventral fins -->
    <path d="M120 78 C132 50 156 46 168 64 C156 68 146 76 140 88 Z" fill="#FFC1D6" stroke="#D9769A" stroke-width="3"/>
    <path d="M120 178 C132 206 156 210 168 192 C156 188 146 180 140 168 Z" fill="#FFC1D6" stroke="#D9769A" stroke-width="3"/>

    <!-- Plump rounded body -->
    <ellipse cx="136" cy="128" rx="84" ry="60" fill="#FFD9B8"/>
    <!-- Soft baby-pink belly patch -->
    <ellipse cx="136" cy="148" rx="60" ry="32" fill="#FFEAE0" stroke="none"/>

    <!-- Gentle pastel scales/decorations -->
    <path d="M104 84 Q92 128 104 172 M128 78 Q116 128 128 178" fill="none" stroke="#FFC1D6" stroke-width="10" opacity=".6" stroke-linecap="round"/>

    <!-- Cute fluttering pectoral fin -->
    <ellipse cx="140" cy="142" rx="16" ry="10" transform="rotate(-15 140 142)" fill="#FFC1D6" stroke="#D9769A" stroke-width="2.5"/>
  </g>

  <!-- Sweet back highlight curve -->
  <path d="M116 80 Q144 68 180 76" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  <circle cx="188" cy="80" r="3" fill="#FFFFFF" opacity=".65"/>

  <!-- Face: Large anime catchlight eye, blush with shine, sweet smile -->
  <circle cx="178" cy="116" r="11" fill="#4A3347"/>
  <path d="M170.9 118.2 Q178 124.3 185.2 118.2" fill="none" stroke="#C48DAE" stroke-width="2" stroke-linecap="round"/>
  <circle cx="181.9" cy="112.2" r="4.2" fill="#FFFFFF"/>
  <circle cx="174.2" cy="119.9" r="2.2" fill="#FFFFFF"/>
  <circle cx="183.5" cy="117.3" r="1.3" fill="#FFFFFF"/>
  <ellipse cx="182" cy="140" rx="12" ry="7" fill="#FF8FA9" opacity=".65"/>
  <path d="M178 138 L176 142 M184 138 L182 142" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>
  <path d="M195 134 Q202 141 209 134" fill="none" stroke="#4A3347" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating pastel bubbles -->
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(214 66) scale(0.75)" fill="#FFF0A8" stroke="#E0B84F" stroke-width="3.3" stroke-linejoin="round"/>
  <circle cx="218" cy="110" r="4.5" fill="#BDE6FF" stroke="#6DB3DE" stroke-width="1.5" opacity=".7"/>
</svg>
