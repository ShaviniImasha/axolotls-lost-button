<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Message in a bottle">
<!-- Bottle glass body -->
  <g stroke="#6DB3DE" stroke-width="3" stroke-linejoin="round">
    <!-- Stopper cork -->
    <rect x="106" y="50" width="44" height="20" rx="8" fill="#FFF0A8" stroke="#E0B84F"/>
    <path d="M110 54 Q128 48 146 54" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".6"/>

    <!-- Bottle neck -->
    <path d="M108 70 L100 100 H156 L148 70 Z" fill="#BDE6FF"/>

    <!-- Bottle main body -->
    <path d="M100 100 C68 108 50 136 54 172 C58 210 88 234 128 234 C168 234 198 210 202 172 C206 136 188 108 156 100 Z" fill="#BDE6FF" opacity=".75"/>
    <!-- Thick glass rim highlight -->
    <path d="M100 100 C68 108 50 136 54 172 C58 210 88 234 128 234 C168 234 198 210 202 172 C206 136 188 108 156 100 Z" fill="none" stroke="#6DB3DE" stroke-width="4"/>

    <!-- Rolled parchment scroll inside -->
    <ellipse cx="128" cy="168" rx="44" ry="34" fill="#FFF0A8" stroke="#E0B84F" stroke-width="2.5"/>
    <path d="M86 168 Q88 152 128 152 Q168 152 170 168" fill="#FFE070" stroke="#E0B84F" stroke-width="2.5"/>
    <path d="M86 168 Q88 184 128 184 Q168 184 170 168" fill="#FFE070" stroke="#E0B84F" stroke-width="2.5"/>

    <!-- Cute handwritten squiggle lines on scroll -->
    <path d="M104 162 Q128 158 152 162" fill="none" stroke="#E0B84F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M108 170 Q128 166 148 170" fill="none" stroke="#E0B84F" stroke-width="2" stroke-linecap="round"/>
    <path d="M112 178 Q128 174 144 178" fill="none" stroke="#E0B84F" stroke-width="2" stroke-linecap="round"/>

    <!-- Tiny heart seal on scroll -->
    <path d="M128 188 C118 182 120 174 126 176 C128 177 128 179 128 179 C128 179 128 177 130 176 C136 174 138 182 128 188 Z" fill="#FFC1D6" stroke="#D9769A" stroke-width="1.5"/>
  </g>

  <!-- Glass shine / reflection -->
  <path d="M74 124 Q68 154 72 184" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity=".55"/>
  <path d="M108 76 Q118 70 130 74" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".65"/>

  <!-- Cute kawaii face on bottle -->
  <circle cx="105" cy="136" r="6" fill="#4A3347"/>
  <circle cx="107" cy="134" r="2.2" fill="#FFFFFF"/>
  <circle cx="151" cy="136" r="6" fill="#4A3347"/>
  <circle cx="153" cy="134" r="2.2" fill="#FFFFFF"/>
  <ellipse cx="92" cy="148" rx="8" ry="5" fill="#FF8FA9" opacity=".6"/>
  <ellipse cx="164" cy="148" rx="8" ry="5" fill="#FF8FA9" opacity=".6"/>
  <path d="M122 146 Q128 152 134 146" fill="none" stroke="#4A3347" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating bubbles -->
  <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(202 64) scale(0.85)" fill="#BDE6FF" stroke="#6DB3DE" stroke-width="2.9" stroke-linejoin="round"/>
  <circle cx="208" cy="108" r="4.5" fill="#BDE6FF" stroke="#6DB3DE" stroke-width="1.5" opacity=".7"/>
</svg>
